services:
  postgres:
    image: postgres:17
    container_name: tala-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tala
    ports:
      - "5432:5432"
    volumes:
      - tala_postgres_data:/var/lib/postgresql/data

volumes:
  tala_postgres_data: